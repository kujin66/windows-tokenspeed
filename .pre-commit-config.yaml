default_stages: [pre-commit, pre-push, manual]

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-symlinks
      - id: trailing-whitespace
        # Preserve the SHA256-addressed historical evidence bytes.
        exclude: ^(docs/validation/|ports/windows-arm64/overlay/)
      - id: end-of-file-fixer
        # Preserve the SHA256-addressed historical evidence bytes.
        exclude: ^(docs/validation/|ports/windows-arm64/overlay/)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-ast
      - id: check-added-large-files
        # Full compiler log retained under the published SHA256 manifest (668 KiB).
        exclude: ^docs/validation/windows-wsl2-perf-20261028-after-reboot/wsl2/logs/kernel-build\.log$
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
      - id: no-commit-to-branch
  - repo: https://github.com/pre-commit/mirrors-clang-format
    # Pin to the major version the CI lint job installs (ubuntu-latest
    # clang-format 18); other majors format differently and ping-pong.
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: ^tokenspeed-scheduler/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        # Preserve the SHA256-addressed historical evidence bytes.
        exclude: ^(docs/validation/|ports/windows-arm64/overlay/)
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black-jupyter
        # Preserve the SHA256-addressed historical evidence bytes.
        exclude: ^(docs/validation/|ports/windows-arm64/overlay/)
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args:
          - '--keep-output'
          - '--extra-keys=metadata.kernelspec metadata.language_info.version'
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: AMD ops README line length
        files: ^tokenspeed-kernel-amd/python/tokenspeed_kernel_amd/ops/README\.md$
        args:
          - --config
          - tokenspeed-kernel-amd/python/tokenspeed_kernel_amd/ops/.markdownlint.yaml
