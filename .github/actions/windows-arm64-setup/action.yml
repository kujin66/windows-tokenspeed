name: Prepare Windows ARM64
description: Activate the native compiler and optionally prepare pinned CUDA dependencies.
inputs:
  working-directory:
    description: Source checkout directory relative to the workspace.
    default: '.'
  profile:
    description: cpu or cuda; cuda requires a prepared GPU runner.
    required: true
runs:
  using: composite
  steps:
    - name: Activate native ARM64 compiler
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_PROFILE: ${{ inputs.profile }}
      run: ./tools/windows/activate_toolchain.ps1 -Profile $env:BUILD_PROFILE
    - name: Prepare pinned CUDA build environment
      if: inputs.profile == 'cuda'
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        python -m venv .venv
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        .venv/Scripts/python tools/windows/prepare_public_dependencies.py --output outputs/public-dependencies
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ('TOKENSPEED_FLASHINFER_DATA_DIR={0}' -f (Resolve-Path outputs/public-dependencies/flashinfer-headers).Path) >> $env:GITHUB_ENV
        $pipArgs = @('-m', 'pip', 'install', '--find-links', 'outputs/public-dependencies', '-r', 'requirements/windows-arm64-build.txt')
        if ($env:TOKENSPEED_WINDOWS_WHEELHOUSE) { $pipArgs += @('--find-links', $env:TOKENSPEED_WINDOWS_WHEELHOUSE) }
        .venv/Scripts/python @pipArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ('PATH={0};{1}' -f (Resolve-Path .venv/Scripts).Path, $env:PATH) >> $env:GITHUB_ENV
