name: Build TokenSpeed Windows ARM64 wheels
description: Build and test on a prepared native ARM64 CUDA runner
inputs:
  cuda_arch:
    description: CUDA architecture selected for the runner GPU
    required: true
runs:
  using: composite
  steps:
    - name: Activate native ARM64 compiler
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        $vs = & $vswhere -latest -products '*' -property installationPath
        if (-not $vs) { throw 'Visual Studio with ARM64 C++ tools is required' }
        & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch arm64 -HostArch arm64 -SkipAutomaticLocation
        # ring uses Clang for its Windows ARM64 assembly sources.
        $llvm = Join-Path $vs 'VC/Tools/Llvm/ARM64/bin'
        if (Test-Path (Join-Path $llvm 'clang.exe')) { $env:PATH = $llvm + ';' + $env:PATH }
        if (-not (Get-Command clang.exe -ErrorAction SilentlyContinue)) { throw 'LLVM clang.exe is required by ring on Windows ARM64; add its bin directory to PATH' }
        if ($env:TOKENSPEED_MSVC_ROOT) {
          $installedMsvc = $env:VCToolsInstallDir.TrimEnd([char]92)
          $preparedMsvc = $env:TOKENSPEED_MSVC_ROOT.TrimEnd([char]92)
          if (-not (Test-Path (Join-Path $preparedMsvc 'bin/Hostarm64/arm64/cl.exe'))) { throw 'Prepared ARM64 MSVC compiler is missing' }
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            [Environment]::SetEnvironmentVariable($name, $value.Replace($installedMsvc, $preparedMsvc), 'Process')
          }
          $env:VCToolsInstallDir = $preparedMsvc + [char]92
        }
        if (-not $env:OPENSSL_LICENSE_FILE -or -not (Test-Path -LiteralPath $env:OPENSSL_LICENSE_FILE)) { throw 'OPENSSL_LICENSE_FILE must identify the external OpenSSL license' }
        if (-not $env:OPENSSL_ROOT_DIR) { throw 'OPENSSL_ROOT_DIR must identify the prepared ARM64 static OpenSSL /MD install' }
        foreach ($item in (Get-ChildItem Env:)) {
          if ($item.Name -in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCINSTALLDIR', 'WindowsSdkDir', 'OPENSSL_ROOT_DIR')) {
            ('{0}={1}' -f $item.Name, $item.Value) >> $env:GITHUB_ENV
          }
        }
    - name: Prepare public build dependencies
      shell: pwsh
      run: |
        python -m venv .venv
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        .venv/Scripts/python tools/windows/prepare_public_dependencies.py --output outputs/public-dependencies
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ('TOKENSPEED_FLASHINFER_DATA_DIR={0}' -f (Resolve-Path outputs/public-dependencies/flashinfer-headers).Path) >> $env:GITHUB_ENV
        $pipArgs = @('-m', 'pip', 'install', '--find-links', 'outputs/public-dependencies', '-r', 'requirements/windows-arm64-build.txt')
        if ($env:TOKENSPEED_WINDOWS_WHEELHOUSE) { $pipArgs += @('--find-links', $env:TOKENSPEED_WINDOWS_WHEELHOUSE) }
        .venv/Scripts/python @pipArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ('PATH={0};{1}' -f (Resolve-Path .venv/Scripts).Path, $env:PATH) >> $env:GITHUB_ENV
    - name: Build, audit and test TokenSpeed wheels
      shell: pwsh
      env:
        BUILD_CUDA_ARCH: ${{ inputs.cuda_arch }}
      run: |
        $buildOutput = 'outputs/windows-arm64-${{ github.run_id }}-${{ github.run_attempt }}'
        .venv/Scripts/python tools/windows/build_wheels.py --cuda-arch $env:BUILD_CUDA_ARCH --output $buildOutput
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tokenspeed-windows-arm64
        path: |
          outputs/windows-arm64-*/wheels/*.whl
          outputs/windows-arm64-*/build.json
          outputs/windows-arm64-*/*tests.xml
          outputs/public-dependencies/public-dependencies.json
        if-no-files-found: warn
