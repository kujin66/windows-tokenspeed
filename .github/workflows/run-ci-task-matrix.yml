name: Run CI Task Matrix

on:
  workflow_call:
    inputs:
      release_candidate:
        description: Optional nightly release candidate passed to the upstream kernel backend.
        type: string
        default: ''
      platform:
        description: Explicit execution platform, linux or windows.
        type: string
        required: true
      windows_runner_label:
        description: Prepared Windows ARM64 CUDA runner label.
        type: string
        default: ''
      windows_cuda_arch:
        description: Explicit Windows nvcc architecture.
        type: string
        default: ''
      windows_nightly_date:
        description: Explicit date for Windows nightly metadata, empty for an ordinary CI build.
        type: string
        default: ''
      matrix:
        description: "JSON matrix for this CI stage"
        required: true
        type: string
      install_tokenspeed_mla_from_source:
        description: "Whether to install the in-tree tokenspeed-mla package"
        required: true
        type: string
      b200_runner_label:
        description: "Runner family used to resolve b200 task labels"
        required: false
        default: ""
        type: string
      checkout_ref:
        description: "Optional commit to check out"
        required: false
        default: ""
        type: string
      timeout_minutes:
        description: "Maximum task runtime"
        required: false
        default: 60
        type: number
      comparison_base_ref:
        description: "Optional immutable baseline revision for paired tasks"
        required: false
        type: string
      comparison_candidate_ref:
        description: "Optional immutable candidate revision for paired tasks"
        required: false
        type: string
    secrets:
      HF_TOKEN:
        required: false

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
  CUDA_VERSION: 13.0.1
  TOKENSPEED_B200_RUNNER_LABEL: ${{ inputs.b200_runner_label }}

jobs:
  validate-platform:
    if: inputs.platform != 'linux' && inputs.platform != 'windows'
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        name: Reject unsupported CI platform

  test:
    if: inputs.platform == 'linux'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    name: ${{ matrix.name }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.runner == 'amd-mi45x-cpu-test' && 30 || (matrix.name == 'ut-tokenspeed-kernel' && inputs.timeout_minutes < 90 && 90 || inputs.timeout_minutes) }}
    continue-on-error: ${{ matrix.optional }}
    env:
      INSTALL_TOKENSPEED_MLA_FROM_SOURCE: ${{ inputs.install_tokenspeed_mla_from_source }}
      BASE_REF: ${{ inputs.comparison_base_ref }}
      CANDIDATE_REF: ${{ inputs.comparison_candidate_ref }}
      PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
      # Set only for tasks that select their tests from a pull request's changes.
      TOKENSPEED_CI_CHANGED_PATHS: ${{ matrix.changed_paths || '' }}
      MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      # Authenticate model downloads so cold runners do not hit anonymous
      # Hugging Face rate limits while starting `ts serve`.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Cross-repository PRs cannot receive repository secrets.
      TOKENSPEED_CI_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Check NPU runner environment
        if: matrix.runner == 'tokenspeed-npu-arm64'
        env:
          NPU_RUNNER_NAME: ${{ vars.TOKENSPEED_NPU_ARM_RUNNER_NAME }}
          NPU_REPOSITORY: ${{ vars.TOKENSPEED_NPU_CI_REPOSITORY }}
          TASK_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          [[ -n "$NPU_RUNNER_NAME" && "$RUNNER_NAME" = "$NPU_RUNNER_NAME" ]] || { echo 'NPU runner name does not match the deployment' >&2; exit 1; }
          [[ "$GITHUB_SERVER_URL" = https://github.com ]] || { echo 'Unsupported GitHub server' >&2; exit 1; }
          [[ "$GITHUB_REPOSITORY" = lightseekorg/tokenspeed || ( -n "$NPU_REPOSITORY" && "$GITHUB_REPOSITORY" = "$NPU_REPOSITORY" ) ]] || { echo 'Repository is not allowed on the NPU runner' >&2; exit 1; }
          [[ "$(uname -s)" = Linux ]] || { echo 'Linux is required' >&2; exit 1; }
          case "$(uname -m)" in aarch64|arm64) ;; *) echo 'ARM64 is required' >&2; exit 1 ;; esac
          [[ "$(id -un)" = ci-npu && "$RUNNER_ENVIRONMENT" = self-hosted ]] || { echo 'The self-hosted ci-npu user is required' >&2; exit 1; }
          [[ "$TASK_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo 'Invalid task name' >&2; exit 1; }
          /srv/tokenspeed-npu/cann9-torch29-py312-root/venv/bin/python3 -B -c 'import yaml'
          work="$GITHUB_WORKSPACE/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TASK_NAME}-tokenspeed-npu-arm64"
          echo "NPU_CI_WORK=$work" >> "$GITHUB_ENV"
          echo "WORK_DIR=$work/checkout" >> "$GITHUB_ENV"
          echo 'PYTHONDONTWRITEBYTECODE=1' >> "$GITHUB_ENV"
          echo 'PYTHONUNBUFFERED=1' >> "$GITHUB_ENV"
          echo /srv/tokenspeed-npu/cann9-torch29-py312-root/venv/bin >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: ${{ matrix.workflow_stage == 'kernel-benchmark' && '0' || '1' }}
          persist-credentials: ${{ matrix.runner != 'tokenspeed-npu-arm64' && matrix.workflow_stage != 'kernel-benchmark' }}
          path: run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}-${{ matrix.runner }}${{ matrix.runner == 'tokenspeed-npu-arm64' && '/checkout' || '' }}

      - name: Set work directory
        run: |
          work_dir="${{ github.workspace }}/run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}-${{ matrix.runner }}"
          if [ "${{ matrix.runner }}" = tokenspeed-npu-arm64 ]; then
            work_dir="$NPU_CI_WORK/checkout"
          fi
          echo "WORK_DIR=$work_dir" >> "$GITHUB_ENV"
          # Correctness tasks need writable caches even on full shared volumes.
          if [ "${{ matrix.type }}" = "ut" ] || [ "${{ matrix.type }}" = "eval" ]; then
            echo "TRITON_CACHE_DIR=$work_dir/.triton-cache" >> "$GITHUB_ENV"
          fi
          # Keep project dependencies job-local, but reuse EvalScope downloads
          # from the model cache when the runner provides one.
          if [ "${{ matrix.workflow_stage }}" = "model-test" ]; then
            evalscope_uv_cache_dir="${EVALSCOPE_UV_CACHE_DIR:-}"
            if [ -z "$evalscope_uv_cache_dir" ] && [ -n "${HF_HOME:-}" ]; then
              evalscope_uv_cache_dir="${HF_HOME%/}/.uv-cache/evalscope"
            fi
            if [ -n "$evalscope_uv_cache_dir" ]; then
              echo "EVALSCOPE_UV_CACHE_DIR=$evalscope_uv_cache_dir" >> "$GITHUB_ENV"
            fi
            echo "UV_CACHE_DIR=$work_dir/.uv-cache" >> "$GITHUB_ENV"
            # MIOpen's writable SQLite databases also need job-local storage.
            mkdir -p "$work_dir/.miopen-db" "$work_dir/.miopen-kernels"
            echo "MIOPEN_USER_DB_PATH=$work_dir/.miopen-db" >> "$GITHUB_ENV"
            echo "MIOPEN_CUSTOM_CACHE_DIR=$work_dir/.miopen-kernels" >> "$GITHUB_ENV"
          fi

      - name: Restore MI450 simulator cache
        # The current amd-mi45x-cpu-test base image already contains the matching
        # ROCm, Torch, and prebuilt rocJITsu source/build tree.
        if: ${{ false }}
        id: mi450-simulator-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
            ${{ runner.temp }}/tokenspeed-mi450-sim
          key: mi450-sim-${{ runner.os }}-rocjitsu-9083cc2a-rocm-20260822-v1

      - name: Install pipeline dependency
        if: matrix.runner != 'tokenspeed-npu-arm64'
        # pypi.org occasionally returns "Content-Type: Unknown" for the simple
        # index, which strict pip>=22 refuses to parse. Retry a few times.
        run: |
          for i in 1 2 3 4 5; do
            python3 -m pip install pyyaml && exit 0
            echo "pyyaml install attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Install CI task
        if: matrix.runner != 'tokenspeed-npu-arm64'
        run: |
          cd "${{ env.WORK_DIR }}"
          mkdir -p .ci-artifacts
          python3 test/ci_system/pipeline.py execute \
            --config "${{ matrix.config }}" \
            --runner "${{ matrix.runner }}" \
            --work-dir "${{ env.WORK_DIR }}" \
            --print-plan \
            --only-stage install \
            --keep-runner-state \
            --result-json .ci-artifacts/result.json

      - name: Save MI450 simulator cache
        # Keep disabled while the simulator toolchain is baked into the
        # amd-mi45x-cpu-test base image.
        if: ${{ false }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
            ${{ runner.temp }}/tokenspeed-mi450-sim
          key: ${{ steps.mi450-simulator-cache.outputs.cache-primary-key }}

      - name: Execute CI task
        run: |
          cd "${{ env.WORK_DIR }}"
          # NPU run_step.sh checks a clean checkout before each phase.
          if [ "${{ matrix.runner }}" != tokenspeed-npu-arm64 ]; then
            mkdir -p .ci-artifacts
          fi
          python3 test/ci_system/pipeline.py execute \
            --config "${{ matrix.config }}" \
            --runner "${{ matrix.runner }}" \
            --work-dir "${{ env.WORK_DIR }}" \
            --print-plan \
            --skip-stage install \
            --reuse-runner-state \
            --result-json .ci-artifacts/result.json

      - name: Checkout source reporter
        if: ${{ always() && (matrix.runner != 'tokenspeed-npu-arm64' || env.NPU_CI_WORK != '') }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: ${{ env.WORK_DIR }}-source
          sparse-checkout: .github/scripts/ci_result_source.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Record checked-out source
        if: ${{ always() && (matrix.runner != 'tokenspeed-npu-arm64' || env.NPU_CI_WORK != '') }}
        env:
          EXPECTED_SOURCE: ${{ inputs.checkout_ref || github.sha }}
          CONFIG: ${{ matrix.config }}
          RUNNER: ${{ matrix.runner }}
        run: >-
          python3 "${{ env.WORK_DIR }}-source/.github/scripts/ci_result_source.py"
          --work-dir "$WORK_DIR" --expected "$EXPECTED_SOURCE"
          --config "$CONFIG" --runner "$RUNNER"

      - name: Collect NPU operator reports
        if: ${{ always() && matrix.runner == 'tokenspeed-npu-arm64' && env.NPU_CI_WORK != '' }}
        run: |
          destination="$WORK_DIR/.ci-artifacts/published/npu"
          mkdir -p "$destination"
          for phase in accuracy performance; do
            if [ -d "$NPU_CI_WORK/$phase" ]; then
              mv "$NPU_CI_WORK/$phase" "$destination/$phase"
            fi
          done

      - name: Upload task result
        if: ${{ always() && (matrix.runner != 'tokenspeed-npu-arm64' || env.NPU_CI_WORK != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-${{ matrix.name }}-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WORK_DIR }}/.ci-artifacts/result.json
            ${{ env.WORK_DIR }}/.ci-artifacts/source.json
            ${{ env.WORK_DIR }}/.ci-artifacts/published/
          include-hidden-files: true

      - name: Upload task logs on failure
        if: ${{ failure() && (matrix.runner != 'tokenspeed-npu-arm64' || env.NPU_CI_WORK != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-${{ matrix.name }}-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}-logs
          path: ${{ env.WORK_DIR }}/.ci-artifacts/
          # .ci-artifacts is a dot-directory; without this the default
          # hidden-file filter drops everything under it.
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Cleanup work directory
        if: always()
        run: |
          if [ "${{ matrix.runner }}" = tokenspeed-npu-arm64 ] && [ -z "${NPU_CI_WORK:-}" ]; then
            exit 0
          fi
          case "${{ matrix.runner }}" in
            gb200*) python3 "${{ env.WORK_DIR }}/test/ci_system/process_group_manager.py" cleanup-stale || true ;;
            tokenspeed-npu-arm64) rm -rf "$NPU_CI_WORK" ;;
          esac
          rm -rf "${{ env.WORK_DIR }}"
          rm -rf "${{ env.WORK_DIR }}-source"

  windows-test:
    if: inputs.platform == 'windows'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    name: ${{ matrix.name }} (${{ matrix.runner }})
    runs-on: [self-hosted, Windows, ARM64, tokenspeed-cuda, '${{ inputs.windows_runner_label }}']
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        shell: pwsh
        working-directory: s
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      MAX_JOBS: '1'
      TRITON_DEFAULT_FP_FUSION: '1'
      CMAKE_ARGS: '-DCMAKE_TRY_COMPILE_CONFIGURATION=Release'
      TOKENSPEED_CUDA_ARCH: ${{ inputs.windows_cuda_arch }}
      TOKENSPEED_KERNEL_RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
      TOKENSPEED_WINDOWS_NIGHTLY_DATE: ${{ inputs.windows_nightly_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: s
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: ./s/.github/actions/windows-arm64-setup
        with:
          profile: cuda
          working-directory: s
      - name: Execute CI task
        env:
          TASK_CONFIG: ${{ matrix.config }}
          TASK_RUNNER: ${{ matrix.runner }}
        run: >-
          python test/ci_system/pipeline.py execute --config $env:TASK_CONFIG
          --runner $env:TASK_RUNNER --work-dir . --print-plan
          --result-json .ci-artifacts/result.json
      - name: Record checked-out source
        if: always()
        env:
          EXPECTED_SOURCE: ${{ inputs.checkout_ref || github.sha }}
          TASK_CONFIG: ${{ matrix.config }}
          TASK_RUNNER: ${{ matrix.runner }}
        run: >-
          python .github/scripts/ci_result_source.py --work-dir .
          --expected $env:EXPECTED_SOURCE --config $env:TASK_CONFIG --runner $env:TASK_RUNNER
      - name: Upload task result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokenspeed-windows-arm64
          include-hidden-files: true
          path: |
            s/.ci-artifacts/
            s/outputs/windows-arm64/wheels/*.whl
            s/outputs/windows-arm64/build.json
            s/outputs/windows-arm64/*tests.xml
            s/outputs/public-dependencies/public-dependencies.json
            s/outputs/vendor-jit-tests.xml
          if-no-files-found: warn
