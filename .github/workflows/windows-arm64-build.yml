name: Windows ARM64 build validation

on:
  push:
    branches: [main]
    paths: &windows_paths
      - 'tools/windows/**'
      - 'requirements/windows-arm64-build.txt'
      - 'test/windows/**'
      - 'test/ci/ut/ut-windows-arm64-build.yaml'
      - 'test/ci_system/**'
      - 'python/**'
      - 'tokenspeed-engine/**'
      - 'tokenspeed-scheduler/**'
      - 'tokenspeed-kernel/**'
      - '.github/actions/windows-arm64-setup/**'
      - '.github/scripts/windows_ci_plan.py'
      - '.github/scripts/verify_windows_release.py'
      - '.github/scripts/update-nightly-index.py'
      - '.github/workflows/release-tokenspeed.yml'
      - '.github/workflows/windows-arm64-build.yml'
      - '.github/workflows/run-ci-task-matrix.yml'
  pull_request:
    branches: [main, 'baseline/upstream-*']
    paths: *windows_paths
  workflow_dispatch:
    inputs:
      native_cuda:
        description: Run native CUDA tasks on the prepared ARM64 runner.
        type: boolean
        required: true
        default: false
      cuda_arch:
        description: Explicit nvcc architecture, or repository TOKENSPEED_WINDOWS_CUDA_ARCH.
        type: string
      runner_label:
        description: Prepared runner label, or repository TOKENSPEED_WINDOWS_ARM64_RUNNER_LABEL.
        type: string
  workflow_call:
    inputs:
      release_candidate:
        description: Optional nightly release candidate passed to the upstream kernel backend.
        type: string
        default: ''
      nightly_date:
        description: Explicit date selected by the upstream release controller.
        type: string
        default: ''
      native_cuda:
        type: boolean
        required: true
      cuda_arch:
        type: string
        required: true
      runner_label:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: windows-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-tools:
    name: Build tool checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest PyYAML packaging
      - name: Install Linux release-controller dependencies
        if: runner.os == 'Linux'
        run: |
          python test/ci_system/engine_cache.py --build-requirements > "$RUNNER_TEMP/engine-requirements.txt"
          python -m pip install cryptography -r "$RUNNER_TEMP/engine-requirements.txt"
      - name: Prepare pinned FlashInfer patch regression input
        run: >-
          python -m pip download --only-binary=:all: --no-deps flashinfer-python==0.6.17 --dest outputs/public-dependencies
      - name: Validate platform build tools
        env:
          TOKENSPEED_FLASHINFER_TEST_WHEEL: outputs/public-dependencies/flashinfer_python-0.6.17-py3-none-any.whl
        run: python -m pytest -q --confcutdir=test/windows test/windows/test_native_build.py -k 'rejects_non_pe or wheel_machine_validation or build_command or header_patch' --junitxml=build-tools.xml
      - name: Validate shared Windows CI execution and release verification
        run: python -m pytest -q --confcutdir=test/ci_system test/ci_system/test_windows_ci.py test/ci_system/test_windows_release.py test/ci_system/test_ci_gate.py --junitxml=windows-ci.xml
      - name: Validate upstream CI controllers on Linux
        if: runner.os == 'Linux'
        run: >-
          python -m pytest -q --confcutdir=test/ci_system test/ci_system/test_pipeline.py
          test/ci_system/test_dispatch_workflows.py test/ci_system/test_weekly_release.py
          test/ci_system/test_nightly_release.py test/ci_system/test_ci_path_filter.py
          test/ci_system/test_engine_cache.py test/ci_system/test_runtime_test_selection.py --junitxml=upstream-ci.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-tools-${{ matrix.os }}
          path: |
            build-tools.xml
            windows-ci.xml
            upstream-ci.xml

  scan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tasks.outputs.matrix }}
      enabled: ${{ steps.tasks.outputs.enabled }}
      required: ${{ steps.tasks.outputs.required }}
      coverage: ${{ steps.tasks.outputs.coverage }}
      runner_label: ${{ steps.tasks.outputs.runner_label }}
      cuda_arch: ${{ steps.tasks.outputs.cuda_arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - name: Select native tasks
        id: tasks
        env:
          NATIVE_REQUESTED: ${{ inputs.native_cuda }}
          REQUESTED_RUNNER: ${{ inputs.runner_label || vars.TOKENSPEED_WINDOWS_ARM64_RUNNER_LABEL }}
          REQUESTED_ARCH: ${{ inputs.cuda_arch || vars.TOKENSPEED_WINDOWS_CUDA_ARCH }}
          TRUSTED_PR: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: python .github/scripts/windows_ci_plan.py

  native-cuda:
    needs: [build-tools, scan]
    if: needs.scan.outputs.enabled == 'true'
    uses: ./.github/workflows/run-ci-task-matrix.yml
    with:
      matrix: ${{ needs.scan.outputs.matrix }}
      install_tokenspeed_mla_from_source: ${{ 'false' }}
      platform: windows
      windows_runner_label: ${{ needs.scan.outputs.runner_label }}
      windows_cuda_arch: ${{ needs.scan.outputs.cuda_arch }}
      release_candidate: ${{ inputs.release_candidate || '' }}
      windows_nightly_date: ${{ inputs.nightly_date || '' }}
      timeout_minutes: 120

  native-gate:
    name: Windows ARM64 required validation
    if: always()
    needs: [build-tools, scan, native-cuda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce native validation when required
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_REQUIRED_JOBS: build-tools scan ${{ needs.scan.outputs.required == 'true' && 'native-cuda' || '' }}
        run: python3 test/ci_system/ci_gate.py
