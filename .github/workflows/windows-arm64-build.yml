name: Windows ARM64 build validation

on:
  push:
    branches: ['build/windows-arm64-*']
  pull_request:
    branches: [main]
    paths:
      - 'tools/windows/**'
      - 'test/windows/**'
      - 'tokenspeed-engine/**'
      - 'tokenspeed-scheduler/**'
      - 'tokenspeed-kernel/**'
      - '.github/workflows/windows-arm64-build.yml'
      - '.github/actions/windows-arm64-build/**'
  workflow_dispatch:
    inputs:
      native_cuda:
        description: Run the prepared Windows ARM64 CUDA runner
        type: boolean
        required: true
        default: false
      cuda_arch:
        description: nvcc architecture for the native runner GPU
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-tools:
    name: Build tool checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Validate PE wheel audit behavior
        run: python -m pytest -q --confcutdir=test/windows test/windows/test_native_build.py -k 'rejects_non_pe or wheel_machine_validation' --junitxml=build-tools.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-tools-${{ matrix.os }}
          path: build-tools.xml

  native-cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.native_cuda
    runs-on: [self-hosted, Windows, ARM64, tokenspeed-cuda]
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      MAX_JOBS: '1'
      CMAKE_ARGS: '-DCMAKE_TRY_COMPILE_CONFIGURATION=Release'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-arm64-build
        with:
          cuda_arch: ${{ inputs.cuda_arch }}
