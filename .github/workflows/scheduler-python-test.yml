name: Scheduler Python Test

on:
  push:
    branches: [main]
    paths:
      - "tokenspeed-scheduler/**"
      - ".github/workflows/scheduler-python-test.yml"
      - ".github/actions/windows-arm64-setup/**"
      - "tools/windows/activate_toolchain.ps1"
  pull_request:
    branches: [main, 'baseline/upstream-*']
    paths:
      - "tokenspeed-scheduler/**"
      - ".github/workflows/scheduler-python-test.yml"
      - ".github/actions/windows-arm64-setup/**"
      - "tools/windows/activate_toolchain.ps1"
  workflow_dispatch:

concurrency:
  group: scheduler-python-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-11-arm
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Activate Windows compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-arm64-setup
        with:
          profile: cpu-openssl

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install dependencies
        run: |
          python -m pip install -e 'tokenspeed-scheduler[test]'

      - name: Run scheduler Python tests
        run: python -m pytest tokenspeed-scheduler/python/tests --junitxml=scheduler-python.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-python-${{ matrix.os }}
          path: scheduler-*.xml
