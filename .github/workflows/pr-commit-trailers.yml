name: PR Commit Trailers

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-commit-trailers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-trailers:
    name: Commit trailers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use the PR merge commit so older branches inherit the check scripts.
      # The checks below still inspect the original PR head commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify unchanged official history during fork synchronization
        if: github.repository != 'lightseekorg/tokenspeed'
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none https://github.com/lightseekorg/tokenspeed.git main
          upstream_base=$(git merge-base HEAD FETCH_HEAD)
          accepted="$RUNNER_TEMP/official-history.txt"
          git rev-list "$upstream_base" > "$accepted"
          echo "UPSTREAM_COMMITS_FILE=$accepted" >> "$GITHUB_ENV"

      - name: Check commit co-authors
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          commits="$RUNNER_TEMP/pr-commits.txt"
          message="$RUNNER_TEMP/pr-commit-message.txt"
          forbidden='^[[:space:]]*Co-authored-by:.*(Codex|Claude[[:space:]]+Code|noreply@anthropic\.com|\bCursor\b|\bCopilot\b)'
          git rev-list "refs/remotes/origin/$BASE_REF..$HEAD_SHA" > "$commits"

          failed=false
          while IFS= read -r commit; do
            if [ -n "${UPSTREAM_COMMITS_FILE:-}" ] && grep -Fxq "$commit" "$UPSTREAM_COMMITS_FILE"; then
              continue
            fi
            git log -1 --format=%B "$commit" > "$message"
            if grep -qiE "$forbidden" "$message"; then
              echo "::error::Commit $commit has a Co-authored-by trailer blocked by the attribution policy."
              failed=true
            fi
          done < "$commits"

          if [[ "$failed" == true ]]; then
            echo "::error::Amend the listed commits to remove these Co-authored-by trailers, then push the updated branch."
            exit 1
          fi
          echo "Commit trailers comply with the attribution policy."

      - name: Test commit attribution check
        run: node --test .github/scripts/check-commit-attribution.test.js

      - name: Check commit email attribution
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const check = require('./.github/scripts/check-commit-attribution.js');
            const upstreamCommits = new Set(process.env.UPSTREAM_COMMITS_FILE
              ? fs.readFileSync(process.env.UPSTREAM_COMMITS_FILE, 'utf8').trim().split(/\s+/)
              : []);
            await check({ github, core, context, upstreamCommits });
