name: TokenSpeed Engine Rust Test

on:
  push:
    branches: [main]
    paths:
      - "tokenspeed-engine/**"
      - "tokenspeed-scheduler/**"
      - ".github/workflows/tokenspeed-engine-test.yml"
      - ".github/actions/windows-arm64-setup/**"
      - "tools/windows/activate_toolchain.ps1"
  pull_request:
    branches: [main, 'baseline/upstream-*']
    paths:
      - "tokenspeed-engine/**"
      - "tokenspeed-scheduler/**"
      - ".github/workflows/tokenspeed-engine-test.yml"
      - ".github/actions/windows-arm64-setup/**"
      - "tools/windows/activate_toolchain.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokenspeed-engine-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokenspeed-engine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ts-scheduler compiles the scheduler and its nanobind module into the
      # binary, as the scheduler wheel build does.
      - name: Install the C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev
          python -m pip install "nanobind>=2.13.0" tokenspeed-spdlog==1.15.1
          echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The wheel the engine installs: the extension module and ts-host.
      - name: Build the wheel
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m pip install --no-deps dist/tokenspeed_engine-*.whl
          cd /tmp && python -c 'import os, tokenspeed_engine; assert os.access(tokenspeed_engine.host_binary(), os.X_OK)'

  windows-test:
    name: Windows ARM64 Rust compiler checks
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
        working-directory: tokenspeed-engine
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_GENERATOR: Ninja
      CMAKE_ARGS: '-DCMAKE_TRY_COMPILE_CONFIGURATION=Release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ./.github/actions/windows-arm64-setup
        with:
          profile: cpu-openssl
      - name: Install native build dependencies
        run: |
          python -m pip install "nanobind>=2.13.0" tokenspeed-spdlog==1.15.1
          "PYO3_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint supported native crates
        run: cargo clippy --locked -p tokenspeed-metrics -p tokenspeed-host -p tokenspeed-scheduler --lib --bins -- -D warnings
      - name: Test supported native crates
        run: cargo test --locked -p tokenspeed-metrics -p tokenspeed-host -p tokenspeed-scheduler --lib --bins
