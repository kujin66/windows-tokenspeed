name: Release TokenSpeed Engine

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      source_run_id:
        type: string
        required: true
      nightly_date:
        type: string
        required: true
      dry_run:
        type: boolean
        required: true
      publish_windows_index:
        type: boolean
        required: true
    secrets:
      TOKENSPEED_RELEASE_TOKEN:
        required: false
      LIGHTSEEK_BOT_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      mode:
        description: Build and test wheels, or also publish them to PyPI
        required: true
        type: choice
        options:
          - dry-run
          - publish

permissions:
  contents: read

concurrency:
  group: release-tokenspeed-engine
  cancel-in-progress: false

jobs:
  build:
    if: >-
      inputs.platform == '' && inputs.source_run_id == '' && inputs.nightly_date == '' && !inputs.publish_windows_index && inputs.dry_run != true && (github.repository == 'lightseekorg/tokenspeed' || github.event_name != 'schedule') &&
      (inputs.mode == 'dry-run' || (inputs.mode == 'publish' && github.repository == 'lightseekorg/tokenspeed' && github.ref == 'refs/heads/main'))
    name: Wheel (${{ matrix.arch }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build and repair wheel
        env:
          ARCH: ${{ matrix.arch }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          docker run --rm \
            -v "$PWD:/io" -w /io \
            -e PYTHON_VERSION -e ARCH \
            -e CARGO_BUILD_JOBS=4 -e CMAKE_BUILD_PARALLEL_LEVEL=4 \
            "quay.io/pypa/manylinux_2_28_${ARCH}:latest" \
            bash test/ci_system/build_engine_wheel.sh

      - name: Test installed wheel outside the build environment
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          docker run --rm \
            -v "$PWD/dist:/wheels:ro" \
            -v "$PWD/test/ci_system/check_engine_wheel.py:/check_engine_wheel.py:ro" \
            "python:${PYTHON_VERSION}-slim" \
            sh -ec 'python -m venv /tmp/runtime; /tmp/runtime/bin/pip install --no-index /wheels/*.whl; /tmp/runtime/bin/python /check_engine_wheel.py'

      - name: Upload tested wheel
        uses: actions/upload-artifact@v4
        with:
          name: tokenspeed-engine-${{ matrix.arch }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      inputs.platform == '' && inputs.source_run_id == '' && inputs.nightly_date == '' && !inputs.publish_windows_index && inputs.dry_run != true && github.repository == 'lightseekorg/tokenspeed' &&
      (inputs.mode == 'publish' && github.repository == 'lightseekorg/tokenspeed' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download tested wheels
        uses: actions/download-artifact@v4
        with:
          pattern: tokenspeed-engine-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  invalid-windows-call:
    if: >-
      inputs.platform != 'windows' && !(inputs.platform == '' && inputs.source_run_id == '' && inputs.nightly_date == '' && !inputs.publish_windows_index && inputs.dry_run != true)
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Reusable component calls require platform=windows and an explicit tested source run.' >&2; exit 1

  windows-component:
    if: inputs.platform == 'windows'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    concurrency:
      group: wheelhouse-publication
      cancel-in-progress: false
    outputs:
      version: ${{ steps.component.outputs.version }}
      tag_name: ${{ steps.component.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install packaging
      - name: Verify or publish the tested Windows component
        id: component
        uses: ./.github/actions/windows-component-release
        with:
          component: tokenspeed-engine
          source_run_id: ${{ inputs.source_run_id }}
          nightly_date: ${{ inputs.nightly_date }}
          dry_run: ${{ inputs.dry_run }}
          publish_index: ${{ inputs.publish_windows_index }}
          release_repository: ${{ vars.TOKENSPEED_RELEASE_REPOSITORY || github.repository }}
          index_repository: ${{ vars.TOKENSPEED_RELEASE_INDEX_REPOSITORY || vars.TOKENSPEED_RELEASE_REPOSITORY || github.repository }}
          index_branch: ${{ vars.TOKENSPEED_RELEASE_INDEX_BRANCH || 'gh-pages' }}
          read_token: ${{ github.token }}
          release_token: ${{ secrets.TOKENSPEED_RELEASE_TOKEN || github.token }}
          index_token: ${{ secrets.TOKENSPEED_RELEASE_TOKEN }}
