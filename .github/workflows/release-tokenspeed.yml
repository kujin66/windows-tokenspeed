name: Release TokenSpeed

on:
  workflow_dispatch:
    inputs:
      windows_arm64:
        description: Build, test and attach all four Windows ARM64 wheels before release.
        type: boolean
        required: true
        default: false
      publish_windows_index:
        description: Update the configured Windows ARM64 pip index after publishing verified wheels.
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  windows-build:
    if: inputs.windows_arm64
    uses: ./.github/workflows/windows-arm64-build.yml
    with:
      native_cuda: true
      runner_label: ${{ vars.TOKENSPEED_WINDOWS_ARM64_RUNNER_LABEL }}
      cuda_arch: ${{ vars.TOKENSPEED_WINDOWS_CUDA_ARCH }}

  release:
    needs: windows-build
    if: >-
      !cancelled() &&
      (!inputs.windows_arm64 || needs.windows-build.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ format('v{0}', steps.metadata.outputs.version) }}
    env:
      RELEASE_REPOSITORY: ${{ vars.TOKENSPEED_RELEASE_REPOSITORY || github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate index request
        if: inputs.publish_windows_index
        env:
          WINDOWS_ARM64: ${{ inputs.windows_arm64 }}
          INDEX_TOKEN_CONFIGURED: ${{ secrets.TOKENSPEED_RELEASE_TOKEN != '' }}
        run: |
          if [ "$WINDOWS_ARM64" != true ] || [ "$INDEX_TOKEN_CONFIGURED" != true ]; then
            echo 'The Windows index requires windows_arm64=true and TOKENSPEED_RELEASE_TOKEN for Pages deployment.' >&2
            exit 1
          fi

      - name: Download validated Windows distributions
        if: inputs.windows_arm64
        uses: actions/download-artifact@v4
        with:
          name: tokenspeed-windows-arm64
          path: windows-dist

      - name: Verify native source, task completion and artifact hashes
        if: inputs.windows_arm64
        run: python .github/scripts/verify_windows_release.py windows-dist --source-sha "$GITHUB_SHA" > windows-assets.txt

      - name: Resolve release metadata
        id: metadata
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          pyproject_path = Path("python/pyproject.toml")
          project = tomllib.loads(
              pyproject_path.read_text(encoding="utf-8")
          ).get("project")
          if not isinstance(project, dict) or project.get("name") != "tokenspeed":
              raise SystemExit(f"{pyproject_path} does not describe tokenspeed")

          version = project.get("version")
          if not isinstance(version, str) or not re.fullmatch(
              r"[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._+-]*", version
          ):
              raise SystemExit(f"invalid TokenSpeed version: {version}")

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as output:
              print(f"version={version}", file=output)
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.TOKENSPEED_RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          WINDOWS_ARM64: ${{ inputs.windows_arm64 }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          assets=()
          if [ "$WINDOWS_ARM64" = true ]; then
            mapfile -t assets < windows-assets.txt
          fi

          printf 'Source: https://github.com/%s/commit/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > release-notes.txt
          if [ "$RELEASE_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
            gh release create "$tag" "${assets[@]}" --repo "$RELEASE_REPOSITORY" \
              --title "TokenSpeed $VERSION" --notes-file release-notes.txt --generate-notes --verify-tag
          else
            # A wheelhouse repository has its own history; the source commit is
            # recorded in the release notes and the verified build manifest.
            gh release create "$tag" "${assets[@]}" --repo "$RELEASE_REPOSITORY" \
              --title "TokenSpeed $VERSION" --notes-file release-notes.txt
          fi

  publish-windows-index:
    needs: release
    if: inputs.publish_windows_index
    runs-on: ubuntu-latest
    concurrency:
      group: wheelhouse-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.TOKENSPEED_RELEASE_TOKEN }}
      RELEASE_REPOSITORY: ${{ vars.TOKENSPEED_RELEASE_REPOSITORY || github.repository }}
      INDEX_BRANCH: ${{ vars.TOKENSPEED_RELEASE_INDEX_BRANCH || 'gh-pages' }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: tokenspeed-windows-arm64
          path: windows-dist
      - name: Checkout wheel index
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TOKENSPEED_RELEASE_INDEX_REPOSITORY || vars.TOKENSPEED_RELEASE_REPOSITORY || github.repository }}
          ref: ${{ vars.TOKENSPEED_RELEASE_INDEX_BRANCH || 'gh-pages' }}
          path: wheelhouse
          token: ${{ secrets.TOKENSPEED_RELEASE_TOKEN }}
      - name: Update Windows index with the upstream publisher
        run: |
          set -euo pipefail
          gh api "repos/$RELEASE_REPOSITORY/releases/tags/$TAG_NAME" > published-release.json
          for package in tokenspeed tokenspeed-kernel tokenspeed-scheduler tokenspeed-engine; do
            python .github/scripts/update-nightly-index.py --package "$package" \
              --variant win_arm64 --repository "$RELEASE_REPOSITORY" \
              wheelhouse published-release.json windows-dist
          done
      - name: Publish wheel index
        run: |
          set -euo pipefail
          cd wheelhouse
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows-arm64
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ -f .pre-commit-config.yaml ] || [ -f .pre-commit-config.yml ]; then
            python -m pip install pre-commit
            pre-commit run --all-files
            git add windows-arm64
          fi
          git commit -s -m "Publish Windows ARM64 wheel index"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$INDEX_BRANCH"; then exit 0; fi
            git fetch origin "$INDEX_BRANCH"
            git rebase "origin/$INDEX_BRANCH"
          done
          echo 'Could not publish the Windows wheel index after three attempts.' >&2
          exit 1
