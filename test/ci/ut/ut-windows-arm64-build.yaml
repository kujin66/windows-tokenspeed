api_version: ci.tokenspeed.io/v1
name: ut-windows-arm64-build
type: ut
workflow_stage: unit-test
triggers:
  - per-commit
  - post-submit
  - manual
runner:
  labels:
    - windows-arm64-cuda
env:
  CI: "true"
install:
  - >-
    $env:PYTHONPATH = 'tokenspeed-kernel/python';
    python -m pytest -q --confcutdir=test/windows test/windows/test_native_build.py
    -k vendor_triton --junitxml=outputs/vendor-jit-tests.xml
ut:
  commands:
    - >-
      python tools/windows/build_wheels.py --cuda-arch $env:TOKENSPEED_CUDA_ARCH
      --output outputs/windows-arm64
    - >-
      cmake --build outputs/windows-arm64/scheduler
      --target tokenspeed_scheduler_tests --config Release
    - >-
      ctest --test-dir outputs/windows-arm64/scheduler --no-tests=error
      --output-on-failure --output-junit "$PWD/outputs/windows-arm64/scheduler-tests.xml"
    - >-
      python -m pytest -q --confcutdir=test/windows test/windows/test_native_build.py
      --basetemp=outputs/windows-arm64/pytest-tmp
      --junitxml=outputs/windows-arm64/tests.xml
    - >-
      python -m pytest -q --confcutdir=tokenspeed-kernel/test/nvidia/thirdparty
      tokenspeed-kernel/test/nvidia/thirdparty/test_collective_sentinels.py
      tokenspeed-kernel/test/nvidia/thirdparty/test_marlin_native.py
      --basetemp=outputs/windows-arm64/collective-pytest-tmp
      --junitxml=outputs/windows-arm64/collective-tests.xml
    - >-
      python tools/windows/build_wheels.py run
      cargo test --manifest-path tokenspeed-engine/Cargo.toml --release --locked
      -p tokenspeed-metrics -p tokenspeed-host -p tokenspeed-scheduler --lib --bins
report:
  github_step_summary: true
